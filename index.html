<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>2025 대전 연보 시안 검토</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 방향 흐름 — 메인(시안 목록) → 시안 페이지(목차 + 장면을 한 행에 하나씩, 위→아래). 작업물이 주인공이라 화면은 중립 회색 */
:root{
  --bg:#ECEDEE; --surface:#F7F7F8; --line:#D3D5D9; --fg:#1D2229; --muted:#5D6570; --accent:#1B2A4A; --accent-fg:#FFFFFF; --stage:#DCDEE1;
  --f-display:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
  --f-ui:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --head-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191D; --surface:#1F2328; --line:#343A42; --fg:#E7E9EC; --muted:#A3AAB3; --accent:#9DB5E0; --accent-fg:#0F1621; --stage:#24292F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191D; --surface:#1F2328; --line:#343A42; --fg:#E7E9EC; --muted:#A3AAB3; --accent:#9DB5E0; --accent-fg:#0F1621; --stage:#24292F; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mono{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
html{scroll-behavior:smooth}

/* 헤더: 모든 화면에서 같은 구성 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{padding-block:12px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;font-size:15px}
.tabs{display:flex;gap:4px}
.tabs a{text-decoration:none;font-size:14px;color:var(--muted);padding:5px 10px;border-radius:6px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* 메인 */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:12px 28px;border-bottom:1px solid var(--line)}
.intro h1{font-family:var(--f-display);font-size:clamp(28px,4.2vw,44px);line-height:1.2;font-weight:800}
.intro p{color:var(--muted);margin:10px 0 0;max-width:60ch}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:0}
.spec dt{color:var(--muted)} .spec dd{margin:0}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}
@media (max-width:1180px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--stage)}
.fronts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.5vw,24px);background:var(--stage);padding:clamp(14px,3vw,28px) clamp(18px,5vw,56px)}
.fronts figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fronts img{width:100%;aspect-ratio:176/250;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fronts figcaption{font-size:12px;color:var(--muted)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--f-display);font-size:24px;font-weight:800}
.card h2 small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--muted);margin-left:8px}
.card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.card .go{margin-top:4px;font-weight:700;font-size:14px}
/* 수정안 행: 1·2·3안 위 한 행, 표지 + 이름·색상만 */
.rev-row{margin-top:28px}
.card.rev{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card.rev .fronts{height:100%}
.card.rev .body{justify-content:center}
@media (max-width:860px){.card.rev{grid-template-columns:1fr}}
.rev-row + .plans{margin-top:24px}

/* 메인: 왼쪽 시안 목록 + 오른쪽 진행 상황 */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"main side";gap:32px;align-items:start}
.home-main{grid-area:main;min-width:0}
.home-main .intro{grid-template-columns:1fr}
.home-main .plans{grid-template-columns:repeat(2,minmax(0,1fr))}
.progress{grid-area:side;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h) + 16px);margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 18px 8px}
.progress h2{font-size:16px;font-weight:700}
.progress .sum{margin:6px 0 0;font-size:13px;color:var(--muted)}
.progress .sum b{color:var(--fg)}
.bar{height:6px;border-radius:999px;background:var(--stage);margin:12px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px;padding-bottom:14px}
.step::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--accent)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--muted);position:relative;z-index:1}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.step.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.step.wait .dot{border-style:dashed}
.step h3{font-size:14px;font-weight:700;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.step.todo h3,.step.wait h3{color:var(--muted);font-weight:500}
.step p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.state{font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.step.done .state{border-color:transparent;background:var(--stage);color:var(--fg)}
.step.now .state{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.progress .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding:10px 0 8px;margin-top:2px}
@media (max-width:1000px){
  .home-grid{grid-template-columns:1fr;grid-template-areas:"side" "main";gap:20px}
  .progress{position:static;margin-top:16px}
}
@media (max-width:640px){.home-main .plans{grid-template-columns:1fr}}
/* 홈 외 페이지도 오른쪽에 진행 상황 — 좁은 화면에서는 본문 아래로 */
@media (max-width:1000px){.page-grid{grid-template-areas:"main" "side"}}

/* 시안 페이지 */
.plan-head{padding-block:8px 24px;border-bottom:1px solid var(--line)}
.plan-head h1{font-family:var(--f-display);font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.25;margin-top:4px}
.plan-head > p{color:var(--muted);margin:10px 0 0;max-width:70ch}
.tagline{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.tagline.lg{font-size:clamp(18px,2.2vw,22px);margin-top:8px}
.meaning{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px;margin-top:22px}
.meaning .m{border-top:2px solid var(--fg);padding-top:10px;min-width:0}
.meaning h3{font-size:15px;font-weight:700;margin-bottom:4px}
.meaning p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:860px){.meaning{grid-template-columns:1fr}}
.sys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px}
.type-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.type-row:first-of-type{border-top:0}
.colors{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px;align-items:center}
.colors .h{color:var(--muted);font-size:12px}
.sw{display:flex;align-items:center;gap:6px}
.sw i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.12);flex:none}

.toc{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toc .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.toc .grp.mock{grid-column:1 / -1;padding-block:6px}
.toc h3{font-size:14px;font-weight:700;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;font-size:14px}
.toc li:first-child button{border-top:0}
.toc button:hover{color:var(--accent)}
.toc .n{color:var(--muted);min-width:2ch}

.scene{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head-h) + 16px);margin-top:48px}
.scene-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.scene-head .n{font-size:13px;color:var(--muted)}
.scene-head h2{font-size:20px;font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.scene figure{margin:0;background:var(--stage);border-radius:10px;padding:clamp(10px,2.5vw,28px)}
.scene img{display:block;width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.scene img.page{max-width:620px;margin:0 auto}
.scene img.sheet{max-width:960px;margin:0 auto}
.toc .grp:nth-child(3):last-child{grid-column:1 / -1}
.points{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.book-div{margin-top:56px;padding-top:20px;border-top:2px solid var(--fg);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.book-div h2{font-family:var(--f-display);font-size:24px;font-weight:800}
.book-div span{color:var(--muted);font-size:14px}
.end{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .plans,.sys,.toc{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important} html{scroll-behavior:auto}}

/* 상단 메뉴가 좁은 화면에서 넘치지 않게 */
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap}
.tabs a[data-plan="proof"]{color:var(--fg);font-weight:700}

/* 최종원고 교정교열 */
.pf-sum{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:14px;color:var(--muted)}
.pf-sum b{color:var(--fg);font-size:18px;margin-right:2px}
.pf-meter{margin-top:18px;max-width:520px}
.pf-meter p{margin:0;font-size:13px;color:var(--muted)}
.pf-step{margin-top:44px}
.pf-step > h2{display:flex;align-items:baseline;gap:12px;font-family:var(--f-display);font-size:24px;font-weight:800;padding-top:18px;border-top:2px solid var(--fg)}
.pf-step > h2 .n{font-family:var(--f-ui);font-size:13px;font-weight:700;color:var(--accent-fg);background:var(--accent);border-radius:999px;padding:2px 10px;letter-spacing:.04em}
.pf-step > p.lead{margin:10px 0 0;color:var(--muted);max-width:75ch}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.file{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-decoration:none}
.file:hover{border-color:var(--muted)}
.file .ext{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.file strong{font-size:15px;line-height:1.4}
.file span.d{font-size:13px;color:var(--muted)}
.file .dl{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.howto h3{font-size:14px;margin-bottom:4px}
.howto p{margin:0;color:var(--muted)}
.redbold{color:#D00000;font-weight:800}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .redbold{color:#FF6B6B}}
:root[data-theme="dark"] .redbold{color:#FF6B6B}
.checks{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.chk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.chk h3{font-size:15px;line-height:1.45}
.chk h3 .k{color:var(--muted);font-weight:500;margin-right:6px}
.chk p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.chk .where{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chk .where span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--muted)}
.chk.done{opacity:.55}
.chk.done h3{text-decoration:line-through}
.send{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:18px 20px;margin-top:16px}
.send ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.names{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 12px;margin:10px 0 2px;font-size:13.5px;align-items:center}
.names .a{color:var(--muted)} .names .to{color:var(--muted)} .names .b{font-weight:700}
@media (max-width:640px){.names{grid-template-columns:1fr}.names .to{display:none}.names .b{margin-bottom:8px}}
.pf-fig{margin:14px 0 0;background:var(--stage);border-radius:10px;padding:clamp(10px,3vw,24px);text-align:center}
.pf-fig img{max-width:min(100%,560px);height:auto;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
.pf-fig figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
.chk .points{margin:6px 0 0}
.kakao{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-weight:700}
/* 최종원고 교정교열 2차 */
.tabs a[data-plan="proof2"]{color:var(--fg);font-weight:700}
.chk .tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:1px 7px;margin-left:8px;vertical-align:2px;border:1px solid var(--line);color:var(--muted)}
.chk .tag.top{background:#D00000;border-color:#D00000;color:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.opts div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--bg)}
.opts b{display:block;font-size:14px;margin-bottom:2px;color:var(--fg)}
.opts span{color:var(--muted)}
.fixed{margin:16px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.fixed li span{color:var(--muted)}
/* 최종원고 교정교열 3차 */
.tabs a[data-plan="proof3"]{color:var(--fg);font-weight:700}
.chg{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.chg li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.chg h3{font-size:15px;line-height:1.45}
.chg h3 .k{color:var(--muted);font-weight:500;margin-right:6px}
.chg .ba{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;margin-top:8px;font-size:14px}
.chg .ba dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.chg .ba dd{margin:0}
.chg .ba dd.old{text-decoration:line-through;color:var(--muted)}
.chg .why{margin:8px 0 0;font-size:13.5px;color:var(--muted)}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.st.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.status{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
.status th,.status td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.status th{font-size:12.5px;color:var(--muted);font-weight:600}
@media (max-width:640px){.chg .ba{grid-template-columns:1fr}.chg .ba dt{padding-top:6px}}
</style>

</head><body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">2025 대전광역시 연보 시안</a>
    <nav class="tabs" aria-label="시안">
      <a href="#plan-r" data-plan="r">수정안</a>
      <a href="#plan-1" data-plan="1" hidden>1안 기하 구성</a>
      <a href="#plan-2" data-plan="2" hidden>2안 데이터 흐름</a>
      <a href="#plan-3" data-plan="3" hidden>3안 연결 네트워크</a>
      <a href="#proof" data-plan="proof">최종원고 교정교열</a>
      <a href="#proof2" data-plan="proof2">최종원고 교정교열 2차</a>
      <a href="#proof3" data-plan="proof3" hidden>최종원고 교정교열 3차</a>
    </nav>

    </section>

    <div class="end">
      <a class="btn" href="#proof2">← 교정교열 2차</a>
      <a class="btn primary" href="#pf3-1" id="pf3-top">처음으로 ↑</a>
    </div>`;
  app.querySelectorAll(".checks .chk input").forEach(cb => cb.addEventListener("change", () => {
    const li = cb.closest(".chk"), s = pf3Load();
    s[li.dataset.id] = cb.checked; pf3Save(s); li.classList.toggle("done", cb.checked);
  }));
  document.getElementById("pf3-top").addEventListener("click", e => { e.preventDefault(); document.getElementById("pf3-1").scrollIntoView({ block: "start" }); });
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^plan-([123])(?:-\d+)?$/);   // 예전 상세 주소(#plan-2-5)도 시안 페이지로
  // 주소만으로 들어오면(해시 없음) 가장 최근 교정교열(2차) 화면을 먼저 보여 줌 — 홈은 #home
  if (h === "plan-r") revPage(); else if (h === "proof2" || h === "") proof2Page(); else if (h === "proof3") proof3Page(); else if (h === "proof") proofPage(); else if (m) planPage(m[1]); else home();
  withProgress();
}
// 모든 페이지에 진행 상황 패널을 붙임(홈은 이미 있음). 노드를 옮겨 담아 각 페이지의 이벤트는 그대로 유지
function withProgress() {
  if (app.querySelector(".progress")) return;
  const grid = document.createElement("div");
  grid.className = "home-grid page-grid";
  grid.insertAdjacentHTML("beforeend", progressPanel());
  const main = document.createElement("div");
  main.className = "home-main";
  while (app.firstChild) main.appendChild(app.firstChild);
  grid.appendChild(main);
  app.appendChild(grid);
}
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
