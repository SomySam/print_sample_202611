<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>2025 대전 연보 시안 검토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 방향 흐름 — 메인(시안 목록) → 시안 페이지(목차 + 장면을 한 행에 하나씩, 위→아래). 작업물이 주인공이라 화면은 중립 회색 */
:root{
  --bg:#ECEDEE; --surface:#F7F7F8; --line:#D3D5D9; --fg:#1D2229; --muted:#5D6570; --accent:#1B2A4A; --accent-fg:#FFFFFF; --stage:#DCDEE1;
  --f-display:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
  --f-ui:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --head-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191D; --surface:#1F2328; --line:#343A42; --fg:#E7E9EC; --muted:#A3AAB3; --accent:#9DB5E0; --accent-fg:#0F1621; --stage:#24292F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191D; --surface:#1F2328; --line:#343A42; --fg:#E7E9EC; --muted:#A3AAB3; --accent:#9DB5E0; --accent-fg:#0F1621; --stage:#24292F; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
a{color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.mono{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
html{scroll-behavior:smooth}

/* 헤더: 모든 화면에서 같은 구성 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{padding-block:12px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;font-size:15px}
.tabs{display:flex;gap:4px}
.tabs a{text-decoration:none;font-size:14px;color:var(--muted);padding:5px 10px;border-radius:6px}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current="page"]{color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* 메인 */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;padding-block:12px 28px;border-bottom:1px solid var(--line)}
.intro h1{font-family:var(--f-display);font-size:clamp(28px,4.2vw,44px);line-height:1.2;font-weight:800}
.intro p{color:var(--muted);margin:10px 0 0;max-width:60ch}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:0}
.spec dt{color:var(--muted)} .spec dd{margin:0}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:28px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:var(--stage)}
.fronts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.5vw,24px);background:var(--stage);padding:clamp(14px,3vw,28px) clamp(18px,5vw,56px)}
.fronts figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.fronts img{width:100%;aspect-ratio:176/250;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fronts figcaption{font-size:12px;color:var(--muted)}
.card .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--f-display);font-size:24px;font-weight:800}
.card h2 small{font-family:var(--f-ui);font-size:14px;font-weight:500;color:var(--muted);margin-left:8px}
.card p{margin:0;color:var(--muted);font-size:14px}
.chips{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.12)}
.card .go{margin-top:4px;font-weight:700;font-size:14px}

/* 시안 페이지 */
.plan-head{padding-block:8px 24px;border-bottom:1px solid var(--line)}
.plan-head h1{font-family:var(--f-display);font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.25;margin-top:4px}
.plan-head > p{color:var(--muted);margin:10px 0 0;max-width:70ch}
.tagline{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--fg)}
.tagline.lg{font-size:clamp(18px,2.2vw,22px);margin-top:8px}
.meaning{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px;margin-top:22px}
.meaning .m{border-top:2px solid var(--fg);padding-top:10px;min-width:0}
.meaning h3{font-size:15px;font-weight:700;margin-bottom:4px}
.meaning p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:860px){.meaning{grid-template-columns:1fr}}
.sys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.panel h3{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:10px}
.type-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.type-row:first-of-type{border-top:0}
.colors{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:13px;align-items:center}
.colors .h{color:var(--muted);font-size:12px}
.sw{display:flex;align-items:center;gap:6px}
.sw i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.12);flex:none}

.toc{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.toc .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.toc .grp.mock{grid-column:1 / -1;padding-block:6px}
.toc h3{font-size:14px;font-weight:700;margin-bottom:6px}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.toc button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;font-size:14px}
.toc li:first-child button{border-top:0}
.toc button:hover{color:var(--accent)}
.toc .n{color:var(--muted);min-width:2ch}

.scene{scroll-margin-top:calc(env(safe-area-inset-top,0px) + var(--head-h) + 16px);margin-top:48px}
.scene-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.scene-head .n{font-size:13px;color:var(--muted)}
.scene-head h2{font-size:20px;font-weight:700}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.scene figure{margin:0;background:var(--stage);border-radius:10px;padding:clamp(10px,2.5vw,28px)}
.scene img{display:block;width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.scene img.page{max-width:620px;margin:0 auto}
.points{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.book-div{margin-top:56px;padding-top:20px;border-top:2px solid var(--fg);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.book-div h2{font-family:var(--f-display);font-size:24px;font-weight:800}
.book-div span{color:var(--muted);font-size:14px}
.end{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:860px){
  .intro{grid-template-columns:1fr}
  .plans,.sys,.toc{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important} html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">2025 대전광역시 연보 시안</a>
    <nav class="tabs" aria-label="시안">
      <a href="#plan-1" data-plan="1">1안 기하 구성</a>
      <a href="#plan-2" data-plan="2">2안 데이터 흐름</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
const IMG = n => "img/" + n;
const PLANS = {
  "1": {
    name: "1안", title: "기하 구성",
    tagline: "숫자를 정확히 재고, 빠짐없이 기록한다",
    concept: "연보의 본질인 '측정과 기록'을 원·눈금·격자로 옮긴 안입니다. 표지의 세로선 10개는 2016–2025년 전국 결핵 신환자율 실제 값으로, 10년간의 감소 추세를 그대로 그렸습니다. 강한 색은 핵심 원 하나에만 써서, 많은 통계 속에서도 올해의 결과에 시선이 모이게 했습니다.",
    meaning: [
      ["원과 동심원", "감시의 대상인 지역사회와 그 범위를 뜻합니다. 바깥으로 퍼지는 동심원은 관찰 범위가 넓어지는 감시망을, 52주·12개월 눈금은 연보가 한 해를 주 단위로 빠짐없이 기록한다는 것을 나타냅니다."],
      ["실제 데이터로 그린 선", "결핵연보 표지의 세로선 10개는 2016년부터 2025년까지 전국 결핵 신환자율을 길이로 옮긴 것입니다. 선이 점점 짧아지는 흐름이 그대로 10년간의 감소를 보여 주고, 2025년 한 줄만 강조색으로 표시했습니다."],
      ["점 격자", "신고 한 건 한 건이 모여 통계가 된다는 뜻입니다. 일정한 간격의 점은 표와 그래프가 대부분인 연보의 정밀한 성격을 시각적으로 예고합니다."],
      ["절제된 색", "강한 색은 핵심 원 하나, 보조색은 가는 선과 작은 원에만 씁니다. 공공기관 보고서에 필요한 신뢰감을 유지하면서, 해마다 연도와 수치만 바꿔 같은 형식으로 이어 갈 수 있는 체계입니다."]
    ],
    books: {
      tb: { key: "#EC5A3E", acc: "#1B2A4A", bg: "#EEEDE9", keyName: "코럴" },
      gs: { key: "#1F6AB0", acc: "#17402F", bg: "#EEEDE9", keyName: "블루" }
    }
  },
  "2": {
    name: "2안", title: "데이터 흐름",
    tagline: "해마다 쌓인 기록이 올해의 결과로 흐른다",
    concept: "신고 자료가 해마다 이어져 하나의 흐름을 이루는 모습을 리본으로 표현한 안입니다. 뒤표지에서 시작한 흐름이 책등을 지나 앞표지 위로 올라가, 지난 기록이 올해의 연보로 이어진다는 이야기를 책 한 권에 담았습니다. 밝은 배색으로 시민과 실무자 모두 먼저 펼쳐 보고 싶은 연보를 목표로 했습니다.",
    meaning: [
      ["이어지는 리본", "연도별 신고 자료가 끊기지 않고 이어지는 시간의 흐름입니다. 뒤표지 아래에서 시작해 앞표지 위로 오르는 방향은 과거의 기록이 올해의 결과로 연결되는 연보의 구조와 같습니다."],
      ["여러 겹의 층", "성별·연령·지역·신고기관처럼 연보가 다루는 여러 층위의 자료가 함께 흐르는 모습입니다. 겹이 겹쳐지는 부분은 자료가 서로 맞물려 하나의 해석을 이룬다는 뜻을 담았습니다."],
      ["가는 선과 작은 원", "리본 결을 따라가는 가는 선은 세밀한 분석을, 흐름 위의 작은 원은 개별 신고 사례를 뜻합니다. 큰 흐름 속에서도 한 건 한 건을 놓치지 않는다는 감시의 태도를 표현했습니다."],
      ["같은 구성, 다른 온도", "결핵연보는 따뜻한 색, 감시연보는 차가운 색으로 배색만 바꿨습니다. 두 권이 한 시리즈로 보이면서도 책장에서 바로 구분되고, 이후 다른 연보에도 같은 방식으로 넓힐 수 있습니다."]
    ],
    books: {
      tb: { key: "#E8365D", acc: "#1B2A4A", bg: "#FFF7F3", keyName: "핑크레드" },
      gs: { key: "#2F6BFF", acc: "#17402F", bg: "#F3F8FC", keyName: "블루" }
    }
  }
};
const ORDER = ["1", "2"];
const BOOK = {
  tb: { name: "결핵연보", full: "2025 대전광역시 결핵환자 신고현황 연보" },
  gs: { name: "감시연보", full: "2025 대전광역시 감염병 감시연보" }
};
// 권별 장면 (위 → 아래 순서)
const SCENES = [
  { id: "cover", title: "표지 펼침면", wide: true, points: {
      tb: ["앞표지 → 책등 → 뒤표지로 그래픽이 자연스럽게 이어지는지", "제목 크기·행간(에스코어 드림 700, 행간 1.1)", "기관 로고(대전광역시, 감염병관리지원단)", "책등: 세로쓰기, 제목 위 원형 표시"],
      gs: ["앞표지 → 책등 → 뒤표지 연결", "기관 로고 3종(질병관리청, 감염병관리지원단, 대전광역시)", "보조색(짙은 녹색)이 가는 선·작은 원에만 쓰였는지"] } },
  { id: "spec", title: "디자인 시스템 스펙", points: {
      tb: ["서체: 제목 에스코어 드림 / 본문 나눔명조 / 표·캡션·부록 나눔고딕", "강조색과 보조색(짙은 남색)의 쓰임"],
      gs: ["서체 체계는 결핵연보와 같음", "보조색은 짙은 녹색(감시연보 전용)"] } },
  { id: "toc", title: "목차 펼침", wide: true, points: {
      tb: ["괘선·장 번호는 강조색, 쪽번호·[표 n] 번호는 짙은 남색", "쪽번호는 전년도 기준 가안"],
      gs: ["2024 감시연보 구성에 연도만 바꾼 가안 (원고 미수령)", "로마 숫자 장 번호(I~IV)와 1단계 항목 강조"] } },
  { id: "div", title: "간지 펼침", wide: true, points: {
      tb: ["왼쪽 그래픽이 표지와 같은 언어인지", "장 번호·제목·수록 목록의 위계"],
      gs: ["표지 그래픽과 같은 선 구성(녹색 실선·눈금)", "장 번호·제목 위계"] } },
  { id: "body", title: "본문 샘플", points: {
      tb: ["머리말·쪽번호, 장·절·항 제목 위계", "표: 머리행 강조색, 당해 연도 행 강조, 캡션·단위·주석"],
      gs: ["문안과 표는 예시 (원고 미수령)", "표·캡션 규칙은 결핵연보와 같음"] } }
];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");

function chip(color, label) { return `<span class="chip"><i style="background:${color}"></i>${esc(label)}</span>`; }

function setTabs(k) {
  document.querySelectorAll(".tabs a").forEach(a => {
    if (a.dataset.plan === k) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function home() {
  document.title = "2025 대전 연보 시안 검토";
  setTabs(null);
  const cards = ORDER.map(k => { const p = PLANS[k]; return `
    <a class="card" href="#plan-${k}">
      <div class="fronts">
        <figure><img src="${IMG(`p${k}_tb_front.jpg`)}" alt="${p.name} 결핵연보 앞표지"><figcaption>결핵연보 앞표지</figcaption></figure>
        <figure><img src="${IMG(`p${k}_gs_front.jpg`)}" alt="${p.name} 감시연보 앞표지"><figcaption>감시연보 앞표지</figcaption></figure>
      </div>
      <div class="body">
        <h2>${p.name}<small>${esc(p.title)}</small></h2>
        <div class="tagline">${esc(p.tagline)}</div>
        <p>${esc(p.concept)}</p>
        <div class="chips">
          ${chip(p.books.tb.key, "결핵 강조 " + p.books.tb.keyName)}${chip(p.books.gs.key, "감시 강조 " + p.books.gs.keyName)}
          ${chip(p.books.tb.acc, "결핵 보조 남색")}${chip(p.books.gs.acc, "감시 보조 녹색")}
        </div>
        <span class="go">${p.name} 검토하기 →</span>
      </div>
    </a>`; }).join("");
  app.innerHTML = `
    <section class="intro">
      <div>
        <div class="eyebrow">Design review</div>
        <h1>2025 대전광역시<br>결핵연보 · 감염병 감시연보</h1>
        <p>표지와 내지 디자인 시스템 시안입니다. 아래에서 시안을 고르면 표지, 디자인 시스템, 목차, 간지, 본문 샘플을 결핵연보·감시연보 순서로 이어서 볼 수 있습니다.</p>
      </div>
      <dl class="spec">
        <dt>판형</dt><dd class="mono">176 × 250mm (도련 3mm), 책등 결핵 6mm · 감시 8mm</dd>
        <dt>제목·중제목</dt><dd>에스코어 드림</dd>
        <dt>본문</dt><dd>나눔명조</dd>
        <dt>표·캡션·부록</dt><dd>나눔고딕</dd>
        <dt>상태</dt><dd>결핵연보 원고 반영 / 감시연보는 원고 수령 전 가안</dd>
      </dl>
    </section>
    <section class="plans" aria-label="시안 목록">${cards}</section>`;
  window.scrollTo(0, 0);
}

function planPage(k) {
  const p = PLANS[k];
  document.title = `${p.name} ${p.title} · 시안 검토`;
  setTabs(k);
  const nextK = ORDER[ORDER.indexOf(k) + 1];
  let n = 1;   // 01 = 목업
  const numbered = [];
  ["tb", "gs"].forEach(bk => SCENES.forEach(s => numbered.push({ bk, s, n: ++n })));
  const total = numbered.length + 1;
  const mockScene = `
    <section class="scene" id="s-mockup">
      <div class="scene-head"><span class="n mono">01 / ${total}</span><h2>목업</h2><span class="tag">결핵연보 · 감시연보</span></div>
      <figure><img src="${IMG(`p${k}_mockup.jpg`)}" alt="${p.name} 결핵연보·감시연보 목업"></figure>
      <ul class="points"><li>두 권을 나란히 놓았을 때 시리즈로 보이는지</li><li>실물 비율(176×250mm, 책등 1cm 미만)에서의 인상</li></ul>
    </section>`;
  const toc = `<div class="grp mock"><ol><li><button type="button" data-go="s-mockup"><span class="n mono">01</span>목업 · 두 권 함께</button></li></ol></div>` + ["tb", "gs"].map(bk => `
    <div class="grp"><h3>${BOOK[bk].name}</h3><ol>
      ${numbered.filter(o => o.bk === bk).map(o => `<li><button type="button" data-go="s-${o.bk}-${o.s.id}"><span class="n mono">${String(o.n).padStart(2, "0")}</span>${esc(o.s.title)}</button></li>`).join("")}
    </ol></div>`).join("");
  const scenes = ["tb", "gs"].map(bk => `
    <div class="book-div"><h2>${BOOK[bk].name}</h2><span>${BOOK[bk].full}</span></div>
    ${numbered.filter(o => o.bk === bk).map(o => `
      <section class="scene" id="s-${bk}-${o.s.id}">
        <div class="scene-head"><span class="n mono">${String(o.n).padStart(2, "0")} / ${total}</span><h2>${esc(o.s.title)}</h2><span class="tag">${BOOK[bk].name}</span></div>
        <figure><img class="${o.s.wide ? "" : "page"}" src="${IMG(`p${k}_${bk}_${o.s.id}.jpg`)}" alt="${p.name} ${BOOK[bk].name} ${esc(o.s.title)}"></figure>
        <ul class="points">${o.s.points[bk].map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      </section>`).join("")}`).join("");
  const colorRow = (label, key) => `<span class="h">${label}</span>
    <span class="sw"><i style="background:${p.books.tb[key]}"></i><span class="mono">${p.books.tb[key]}</span></span>
    <span class="sw"><i style="background:${p.books.gs[key]}"></i><span class="mono">${p.books.gs[key]}</span></span>`;
  app.innerHTML = `
    <section class="plan-head">
      <div class="eyebrow">${p.name}</div>
      <h1>${esc(p.title)}</h1>
      <div class="tagline lg">${esc(p.tagline)}</div>
      <p>${esc(p.concept)}</p>
      <div class="meaning" aria-label="디자인 의미">${p.meaning.map(([h, t]) => `<div class="m"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join("")}</div>
      <div class="sys" aria-label="디자인 시스템 요약">
        <div class="panel"><h3>서체</h3>
          <div class="type-row"><b>제목·중제목</b><span>에스코어 드림 500–700</span></div>
          <div class="type-row"><b>본문·목차 항목</b><span>나눔명조 9.5pt</span></div>
          <div class="type-row"><b>표·캡션·부록</b><span>나눔고딕 7–8.5pt</span></div>
          <div class="type-row"><b>표지 제목</b><span>드림 700 · 29pt · 행간 1.1</span></div>
        </div>
        <div class="panel"><h3>색상</h3>
          <div class="colors"><span></span><span class="h">결핵연보</span><span class="h">감시연보</span>
            ${colorRow("강조", "key")}${colorRow("보조", "acc")}${colorRow("바탕", "bg")}
          </div>
        </div>
        <div class="panel"><h3>색 쓰임</h3>
          <div class="type-row"><b>강조</b><span>괘선, 장 번호·제목, 표 머리</span></div>
          <div class="type-row"><b>보조</b><span>쪽번호, [표 n] 번호, 항 제목</span></div>
          <div class="type-row"><b>표지 보조색</b><span>작은 원, 일부 가는 선</span></div>
        </div>
      </div>
      <nav class="toc" aria-label="${p.name} 목차">${toc}</nav>
    </section>
    ${mockScene}
    ${scenes}
    <div class="end">
      <a class="btn" href="#home">← 시안 목록</a>
      ${nextK ? `<a class="btn primary" href="#plan-${nextK}">다음: ${PLANS[nextK].name} ${esc(PLANS[nextK].title)} →</a>` : `<a class="btn primary" href="#home">검토 마침 · 시안 목록으로</a>`}
    </div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const el = document.getElementById(b.dataset.go);
    if (el) el.scrollIntoView({ block: "start" });
  }));
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^plan-([12])(?:-\d+)?$/);   // 예전 상세 주소(#plan-2-5)도 시안 페이지로
  if (m) planPage(m[1]); else home();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
